<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Eventix</title>
    <link rel="stylesheet" href="../Styles/styleglobal.css" />
    <link
      rel="shortcut icon"
      href="../assets/faviconEL.ico"
      type="image/x-icon"
    />
  </head>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const senhaInput = document.getElementById("senha");
      const togglePassword = document.getElementById("toggle-password");

      togglePassword.addEventListener("click", () => {
        const isVisible = senhaInput.type === "text";
        senhaInput.type = isVisible ? "password" : "text";
        togglePassword.textContent = isVisible ? "🔒" : "👁️";
      });
    });
  </script>

  <body>
    <div class="auth-page">
      <div class="container">
        <form class="login-form">
          <h2>Login</h2>

          <div class="inputgroup">
            <input
              type="email"
              id="email"
              placeholder="E-mail"
              required
              class=""
            />
          </div>

          <div class="inputgroup">
            <input
              type="password"
              id="senha"
              placeholder="Senha"
              required
              class=""
            />
            <span class="eye-icon" id="toggle-password">🔒</span>
          </div>

          <div class="options">
            <label><input type="checkbox" id="lembrar" /> Lembrar</label>
            <a href="recuperacaosenha.html">Esqueci a senha</a>
          </div>

          <button type="submit" id="btn-entrar">Entrar</button>
        </form>

        <div class="separator"><span>ou faça login com</span></div>

        <div class="social-buttons">
          <button type="button" class="google-btn">
            <img src="../assets/google.png" alt="Google" class="social-icon" />
            Entrar com Google
          </button>
          <button type="button" class="facebook-btn">
            <img
              src="../assets/facebook.png"
              alt="Facebook"
              class="social-icon"
            />
            Entrar com Facebook
          </button>
        </div>

        <p class="register">
          Ainda não possui uma conta? <a href="cadastro.html">Cadastre-se.</a>
        </p>
      </div>
    </div>
    <script type="module" src="../Js/login.js"></script>
  </body>
</html>
